<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DocuQuery - Document Intelligence Platform</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <!-- Background subtle ambient glow -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand-wrapper">
                    <div class="brand-logo">
                        <i class="fa-solid fa-cube"></i>
                    </div>
                    <div>
                        <h2>DocuQuery</h2>
                        <span class="brand-tag">DOCUMENT INTELLIGENCE</span>
                    </div>
                    <button id="sidebarClose" class="sidebar-close-btn" aria-label="Close Sidebar">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <button id="btnNewChat" class="btn-new-chat">
                <i class="fa-solid fa-plus"></i> New Conversation
            </button>

            <!-- Upload Area -->
            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept=".pdf,.txt" hidden>
                <div class="upload-icon-wrapper">
                    <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                </div>
                <h3>Upload Document</h3>
                <p class="file-types">Drag & drop PDF or TXT files</p>
                <div id="uploadProgress" class="upload-progress hidden">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Processing & Indexing...
                </div>
            </div>

            <!-- Recent Conversations List -->
            <div class="sessions-container">
                <div class="sessions-header">
                    <span>Conversations</span>
                </div>
                <div class="document-list" id="sessionList">
                    <!-- Session items populated dynamically -->
                </div>
            </div>
            
            <!-- User Profile & Logout Footer -->
            <div class="sidebar-user-section" id="userSection">
                <!-- Populated dynamically via script.js -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <header class="chat-header">
                <div class="chat-header-left">
                    <button id="sidebarToggle" class="sidebar-toggle-btn" aria-label="Toggle Sidebar">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div>
                        <h2 id="activeChatTitle">Document Workspace</h2>
                        <p class="status-indicator"><span class="dot"></span> Workspace Active</p>
                    </div>
                </div>
                <div class="export-menu-wrapper">
                    <button class="export-btn" id="exportBtn" title="Export conversation">
                        <i class="fa-solid fa-arrow-up-from-bracket"></i> Export
                    </button>
                    <div class="export-dropdown" id="exportDropdown">
                        <button onclick="exportAsMarkdown()">
                            <i class="fa-brands fa-markdown"></i> Export as Markdown
                        </button>
                        <button onclick="exportAsPDF()">
                            <i class="fa-regular fa-file-pdf"></i> Export as PDF
                        </button>
                    </div>
                </div>
            </header>

            <div class="chat-messages" id="chatMessages">
                <!-- Empty state or chat history will be rendered here -->
            </div>

            <div class="chat-input-area">
                <form id="chatForm">
                    <div class="input-wrapper">
                        <input type="text" id="chatInput" placeholder="Ask anything about your document..." autocomplete="off">
                        <button type="submit" id="sendBtn" title="Send message">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Mobile Backdrop -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Authentication Modal Overlay -->
    <div class="auth-modal-backdrop" id="authModal">
        <div class="auth-modal">
            <button class="auth-close-btn" id="authCloseBtn" onclick="closeAuthModal()" style="display: none;">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="auth-header">
                <div class="auth-logo-badge">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <h2>Welcome to DocuQuery</h2>
                <p>Sign in to access your document workspace and saved conversations</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Sign In</button>
                <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Create Account</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" id="loginUsername" placeholder="name@company.com" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <div class="auth-error" id="loginError"></div>
                <button type="submit" class="auth-submit-btn">Sign In to Workspace</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form hidden">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="e.g. alex_dev" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Work Email</label>
                    <input type="email" id="regEmail" placeholder="alex@company.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password">
                </div>
                <div class="auth-error" id="registerError"></div>
                <button type="submit" class="auth-submit-btn">Create Account & Enter</button>
            </form>
        </div>
    </div>

    <!-- jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
